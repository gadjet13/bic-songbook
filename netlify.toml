[build]
command = "npm run build"
publish = "dist"

[[headers]]
for = "/sw.js"
[headers.values]
Cache-Control = "no-cache"

[[headers]]
for = "/index.html"
[headers.values]
Cache-Control = "no-cache"

[[redirects]]
from = "/oauth/consent"
to = "/index.html"
status = 200

[[headers]]
for = "/oauth/consent"
[headers.values]
Cache-Control = "no-store"
Referrer-Policy = "no-referrer"

[[redirects]]
from = "/setlists/*"
to = "/index.html"
status = 200

[[headers]]
for = "/setlists/*"
[headers.values]
Cache-Control = "no-cache"
Referrer-Policy = "no-referrer"
