<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-label="Before worship: three quick checks"><title>Before worship: three quick checks</title><g font-family="DejaVu Sans,Arial,sans-serif"><rect x="1" y="1" width="998" height="468" rx="14" fill="#f6f8f1" stroke="#d8dfd0"/><text x="34" y="47" font-size="25" fill="#263628" font-weight="700">BIC  /  Before worship: three quick checks</text><text x="34" y="78" font-size="17" fill="#586650" font-weight="400">Do this on the device you will actually use.</text><rect x="34" y="112" width="293" height="292" rx="14" fill="#ffffff" stroke="#d8dfd0"/><text x="55" y="154" font-size="23" fill="#263628" font-weight="700">01  Order and key</text><text x="55" y="207" font-size="18" fill="#263628" font-weight="400">Open your saved setlist.</text><text x="55" y="246" font-size="18" fill="#263628" font-weight="400">Check the song order</text><text x="55" y="278" font-size="18" fill="#263628" font-weight="400">and each saved key.</text><rect x="348" y="112" width="300" height="292" rx="14" fill="#ffffff" stroke="#d8dfd0"/><text x="369" y="154" font-size="23" fill="#263628" font-weight="700">02  Offline copy</text><text x="369" y="207" font-size="18" fill="#263628" font-weight="400">Menu → Offline use</text><text x="369" y="246" font-size="18" fill="#263628" font-weight="400">Save latest for offline</text><text x="369" y="285" font-size="18" fill="#263628" font-weight="400">Wait for the timestamp.</text><rect x="669" y="112" width="297" height="292" rx="14" fill="#ffffff" stroke="#d8dfd0"/><text x="690" y="154" font-size="23" fill="#263628" font-weight="700">03  Reading mode</text><text x="690" y="207" font-size="18" fill="#263628" font-weight="400">Start setlist →</text><text x="690" y="239" font-size="18" fill="#263628" font-weight="400">Reading mode</text><text x="690" y="278" font-size="18" fill="#263628" font-weight="400">Adjust text with A− / A+.</text><text x="690" y="317" font-size="18" fill="#263628" font-weight="400">Use arrows or swipe.</text><text x="34" y="447" font-size="18" fill="#263628" font-weight="400">Test airplane mode beforehand. Stay signed in to keep saved offline access.</text></g></svg>