<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-label="Choose where you work"><title>Choose where you work</title><g font-family="DejaVu Sans,Arial,sans-serif"><rect x="1" y="1" width="998" height="468" rx="14" fill="#f6f8f1" stroke="#d8dfd0"/><text x="34" y="47" font-size="25" fill="#263628" font-weight="700">BIC  /  Choose where you work</text><text x="34" y="78" font-size="17" fill="#586650" font-weight="400">Personal edits and the church collection stay separate.</text><rect x="34" y="112" width="446" height="250" rx="14" fill="#ffffff" stroke="#d8dfd0"/><text x="58" y="158" font-size="25" fill="#263628" font-weight="700">My songbook</text><text x="58" y="198" font-size="19" fill="#263628" font-weight="400">Your versions, folders and setlists</text><rect x="58" y="235" width="185" height="48" rx="14" fill="#eaf1e3" stroke="#d8dfd0"/><text x="74" y="266" font-size="18" fill="#304e32" font-weight="600">Open and edit</text><text x="58" y="327" font-size="17" fill="#586650" font-weight="400">Personal changes stay personal.</text><rect x="504" y="112" width="462" height="250" rx="14" fill="#ffffff" stroke="#d8dfd0"/><text x="528" y="158" font-size="24" fill="#263628" font-weight="700">Bukchon International Chapel</text><text x="528" y="198" font-size="19" fill="#263628" font-weight="400">The main church song collection</text><rect x="528" y="235" width="278" height="48" rx="14" fill="#eaf1e3" stroke="#d8dfd0"/><text x="544" y="266" font-size="18" fill="#304e32" font-weight="600">Copy to My songbook</text><text x="528" y="327" font-size="17" fill="#586650" font-weight="400">Members read; church owner edits.</text><text x="34" y="414" font-size="18" fill="#263628" font-weight="400">New personal song → first saved church copy; later edits leave that copy unchanged.</text></g></svg>