<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-label="Prepare a setlist"><title>Prepare a setlist</title><g font-family="DejaVu Sans,Arial,sans-serif"><rect x="1" y="1" width="998" height="468" rx="14" fill="#f6f8f1" stroke="#d8dfd0"/><text x="34" y="47" font-size="25" fill="#263628" font-weight="700">BIC  /  Prepare a setlist</text><text x="34" y="78" font-size="17" fill="#586650" font-weight="400">Choose songs, keep the order, then share or start reading.</text><rect x="34" y="112" width="430" height="292" rx="14" fill="#ffffff" stroke="#d8dfd0"/><text x="58" y="153" font-size="24" fill="#263628" font-weight="700">Sunday Worship</text><text x="58" y="196" font-size="20" fill="#263628" font-weight="400">1   Morning Song                          G</text><text x="58" y="239" font-size="20" fill="#263628" font-weight="400">2   Hope and Peace                       D</text><rect x="58" y="269" width="380" height="48" rx="14" fill="#eaf1e3" stroke="#d8dfd0"/><text x="74" y="300" font-size="18" fill="#304e32" font-weight="600">Search songs to add</text><text x="58" y="363" font-size="18" fill="#586650" font-weight="400">Save setlist before leaving.</text><rect x="490" y="112" width="476" height="292" rx="14" fill="#ffffff" stroke="#d8dfd0"/><text x="514" y="152" font-size="21" fill="#263628" font-weight="700">Search results show the source</text><text x="514" y="205" font-size="20" fill="#263628" font-weight="400">Morning Song · Your name</text><text x="514" y="244" font-size="20" fill="#263628" font-weight="400">Hope and Peace · BIC</text><text x="514" y="295" font-size="19" fill="#263628" font-weight="600">BIC-only song selected?</text><text x="514" y="333" font-size="18" fill="#263628" font-weight="400">A personal copy is added for you.</text><text x="34" y="447" font-size="19" fill="#304e32" font-weight="600">Start setlist  ·  Copy entire setlist  ·  Share setlist</text></g></svg>