<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-label="Sign in once. Return ready."><title>Sign in once. Return ready.</title><g font-family="DejaVu Sans,Arial,sans-serif"><rect x="1" y="1" width="998" height="468" rx="14" fill="#f6f8f1" stroke="#d8dfd0"/><text x="34" y="47" font-size="25" fill="#263628" font-weight="700">BIC  /  Sign in once. Return ready.</text><text x="34" y="78" font-size="17" fill="#586650" font-weight="400">Illustrated example — labels follow the app; screen layout may vary.</text><rect x="34" y="103" width="440" height="330" rx="14" fill="#ffffff" stroke="#d8dfd0"/><text x="58" y="142" font-size="23" fill="#263628" font-weight="700">Your account</text><rect x="58" y="164" width="390" height="48" rx="14" fill="#eaf1e3" stroke="#d8dfd0"/><text x="74" y="195" font-size="18" fill="#304e32" font-weight="600">Continue with Google</text><text x="58" y="240" font-size="18" fill="#263628" font-weight="400">Or enter your email and password</text><rect x="58" y="269" width="24" height="24" rx="14" fill="#42663b" stroke="#d8dfd0"/><text x="62" y="288" font-size="20" fill="#fff" font-weight="400">✓</text><text x="96" y="290" font-size="18" fill="#263628" font-weight="400">Remember me on this device</text><rect x="58" y="325" width="180" height="48" rx="14" fill="#eaf1e3" stroke="#d8dfd0"/><text x="74" y="356" font-size="18" fill="#304e32" font-weight="600">Sign in</text><text x="517" y="157" font-size="22" fill="#263628" font-weight="700">1. Choose your login method</text><text x="517" y="206" font-size="20" fill="#263628" font-weight="400">2. Keep Remember me checked</text><text x="517" y="255" font-size="20" fill="#263628" font-weight="400">3. Ask a manager for access</text><text x="517" y="304" font-size="20" fill="#263628" font-weight="400">4. Press Refresh library</text><text x="517" y="379" font-size="17" fill="#586650" font-weight="400">Use a regular browser for saved login.</text></g></svg>